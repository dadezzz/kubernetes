apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  selector:
    matchLabels:
      apps.zarantonello.dev/name: server
      apps.zarantonello.dev/namespace: immich
  # Persistent volume cannot be read by 2 replicas.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        monitoring.zarantonello.dev/metrics-0-id: 57464b41-d355-4338-bf09-05a6d035aac9
        monitoring.zarantonello.dev/metrics-0-port: "8081"
      labels:
        apps.zarantonello.dev/name: server
        apps.zarantonello.dev/namespace: immich
    spec:
      containers:
        - env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: postgres-env
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: postgres-env
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB
                  name: postgres-env
          envFrom:
            - configMapRef:
                name: server-env
          image: ghcr.io/immich-app/immich-server:v3.0.3@sha256:c716dc20f957aafd89fa9d284a2ec63e25c9e2d8d8e87c6197d540a3dce237db
          name: immich
          ports:
            - containerPort: 2283
              name: http
          securityContext:
            capabilities:
              drop:
                - ALL
            # Needed for the GPU.
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /usr/src/app/upload
              name: data
            - mountPath: /dev/dri
              name: dev-dri
            - mountPath: /usr/local/bin/ffmpeg
              name: ffmpeg
              subPath: ffmpeg
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: srv-home
      securityContext:
        runAsGroup: 5551
        runAsNonRoot: true
        runAsUser: 5551
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: server-data
        - hostPath:
            path: /dev/dri
            type: Directory
          name: dev-dri
        - configMap:
            defaultMode: 0777
            name: server-ffmpeg
          name: ffmpeg
