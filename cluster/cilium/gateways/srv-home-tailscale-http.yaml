apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: srv-home-tailscale-http
spec:
  addresses:
    - type: IPAddress
      value: 100.107.181.54
    - type: IPAddress
      value: fd7a:115c:a1e0::2d36:b538
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/sharing-cross-namespace: "*"
      lbipam.cilium.io/sharing-key: srv-home-tailscale
  listeners:
    - allowedRoutes: &allowedRoutes
        namespaces:
          from: All
      hostname: "*.zarantonello.net"
      name: http-zarantonello-net
      port: 80
      protocol: HTTP
    - allowedRoutes: *allowedRoutes
      hostname: "*.zarantonello.dev"
      name: http-zarantonello-dev
      port: 80
      protocol: HTTP
