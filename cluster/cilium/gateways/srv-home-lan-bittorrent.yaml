apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: srv-home-lan-bittorrent
spec:
  addresses:
    - type: IPAddress
      value: 192.168.1.4
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/sharing-cross-namespace: "*"
      lbipam.cilium.io/sharing-key: srv-home-lan
  listeners:
    - allowedRoutes: &allowedRoutes
        namespaces:
          from: All
      name: bittorrent-tcp
      port: 51413
      protocol: TCP
    - allowedRoutes: *allowedRoutes
      name: bittorrent-udp
      port: 51413
      protocol: UDP
