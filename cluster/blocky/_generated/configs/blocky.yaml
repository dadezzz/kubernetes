blocking:
  allowlists:
    default:
      # Whitelist push notification providers for mobile phones.
      - https://badblock.celenity.dev/wildcards-star/push_whitelist.txt
      - stats.grafana.org
  blockType: nxDomain
  clientGroupsBlock:
    default:
      - default
  denylists:
    default:
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/dyndns.txt
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/fake-onlydomains.txt
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/gambling.txt
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/hoster-onlydomains.txt
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/native.samsung.txt
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/native.tiktok.extended.txt
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/native.winoffice.txt
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/native.xiaomi.txt
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/pro.plus.txt
      - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/wildcard/tif.txt
  loading:
    concurrency: 2
    downloads:
      cooldown: 10s
      timeout: 60s
    refreshPeriod: 72h
bootstrapDns:
  - tcp+udp:1.1.1.1
  - tcp+udp:1.0.0.1
caching:
  prefetching: true
customDNS:
  mapping:
    actual.zarantonello.net: 100.83.193.88
    grafana.zarantonello.net: 100.83.193.88
    llama.zarantonello.dev: 100.107.198.103
    mail.zarantonello.dev: 100.83.193.88
    metrics.zarantonello.dev: 100.83.193.88
    photos.zarantonello.net: 100.107.198.103
    torrents.zarantonello.net: 100.107.198.103
    vault.zarantonello.net: 100.83.193.88
fqdnOnly:
  enable: true
log:
  format: json
ports:
  dns: 53
  # Used for metrics collection.
  http: 8080
prometheus:
  enable: true
queryLog:
  type: none
upstreams:
  groups:
    default:
      - tcp-tls:1.0.0.1:853#one.one.one.one
      - tcp-tls:1.1.1.1:853#one.one.one.one
      - tcp-tls:149.112.112.112:853#dns.quad9.net
      - tcp-tls:9.9.9.9:853#dns.quad9.net
      # - tcp-tls:2606:4700:4700::1001:853#one.one.one.one
      # - tcp-tls:2606:4700:4700::1111:853#one.one.one.one
      # - tcp-tls:2620:fe::9:853#dns.quad9.net
      # - tcp-tls:2620:fe::fe:853#dns.quad9.net
