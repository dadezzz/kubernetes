apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
  - files:
      - _generated/configs/models.ini
    name: llama-server-config
kind: Kustomization
namespace: llama-server
resources:
  - deployments/llama-server.yaml
  - http-routes/default.yaml
  - kustomization.flux.yaml
  - namespace.yaml
  - persistent-volume-claims/data.yaml
  - persistent-volumes/llama-server-data.yaml
  - service-accounts/default.yaml
  - services/http.yaml
