apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default
spec:
  hostnames:
    - llama.zarantonello.dev
  parentRefs:
    - name: srv-home-tailscale-https
      namespace: cilium
    - name: srv-home-tailscale-http
      namespace: cilium
  rules:
    - backendRefs:
        - name: llama-server
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
