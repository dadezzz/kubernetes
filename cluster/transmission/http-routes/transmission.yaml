apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transmission
spec:
  hostnames:
    - torrents.zarantonello.net
  parentRefs:
    - name: srv-home-tailscale-https
      namespace: cilium
  rules:
    - backendRefs:
        - name: transmission
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
