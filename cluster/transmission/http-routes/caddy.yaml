apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: caddy
spec:
  hostnames:
    - torrents.zarantonello.net
  parentRefs:
    - name: srv-home-tailscale-http
      namespace: cilium
    - name: srv-home-tailscale-https
      namespace: cilium
  rules:
    - backendRefs:
        - name: caddy-http
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /files
