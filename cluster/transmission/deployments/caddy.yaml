apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  selector:
    matchLabels:
      apps.zarantonello.dev/name: caddy
      apps.zarantonello.dev/namespace: transmission
  template:
    metadata:
      labels:
        apps.zarantonello.dev/name: caddy
        apps.zarantonello.dev/namespace: transmission
    spec:
      containers:
        - args:
            - caddy
            - file-server
            - --browse
            - --root=/srv
          image: docker.io/library/caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
          name: caddy
          ports:
            - containerPort: 80
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /srv/files
              name: data
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: srv-home
      securityContext:
        runAsGroup: 29994
        runAsNonRoot: true
        runAsUser: 29994
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
