apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
  - envs:
      - _generated/configs/outline.env
    name: outline-env
kind: Kustomization
namespace: outline
resources:
  - deployments/postgres.yaml
  - deployments/redis.yaml
  - deployments/outline.yaml
  - dnsrecord.yaml
  - http-routes/default.yaml
  - kustomization.flux.yaml
  - namespace.yaml
  - persistent-volume-claims/postgres-data.yaml
  - persistent-volume-claims/redis-data.yaml
  - persistent-volumes/outline-postgres-data.yaml
  - persistent-volumes/outline-redis-data.yaml
  - service-accounts/default.yaml
  - services/postgres.yaml
  - services/redis.yaml
  - services/outline.yaml
secretGenerator:
  - envs:
      - _generated/secrets/outline.env
    name: outline-env
  - envs:
      - _generated/secrets/postgres.env
    name: postgres-env
