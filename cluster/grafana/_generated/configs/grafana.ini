[server]
domain = grafana.zarantonello.net
enforce_domain = true
root_url = https://grafana.zarantonello.net

[security]
cookie_secure = true

[smtp]
enabled = true
from_address = grafana@zarantonello.net
host = stalwart.stalwart.svc.k8s.zarantonello.dev:465
password = $__env{SMTP_PASSWORD}
user = $__env{SMTP_USER}

[log]
level = info
mode = console

[auth]
disable_login_form = true

[auth.basic]
enabled = false

[auth.generic_oauth]
api_url = https://id.zarantonello.dev/api/oidc/userinfo
auth_url = https://id.zarantonello.dev/authorize
client_id = $__env{CLIENT_ID}
client_secret = $__env{CLIENT_SECRET}
enabled = true
login_attribute_path = preferred_username
name = PocketId
scopes = openid email profile
signout_redirect_url = https://id.zarantonello.dev/api/oidc/end-session
skip_org_role_sync = true
token_url = https://id.zarantonello.dev/api/oidc/token
use_pkce = true
