apiVersion: v1
kind: PersistentVolume
metadata:
  name: umami-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 100Mi
  local:
    path: /var/mnt/data-0/umami-postgres-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - srv-hetz-nbg-0
