apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public
spec:
  hostnames:
    - metrics.zarantonello.dev
  parentRefs:
    - name: srv-hetz-nbg-0-public-https
      namespace: cilium
  rules:
    - backendRefs:
        - name: server
          port: 80
      matches:
        - path:
            type: Exact
            value: /script.js
        - path:
            type: Exact
            value: /api/send
        - path:
            type: Exact
            value: /robots.txt
