apiVersion: v1
kind: Service
metadata:
  name: stalwart
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: smtp
      port: 25
      targetPort: smtp
    - name: submissions
      port: 465
      targetPort: submissions
    - name: imaps
      port: 993
      targetPort: imaps
  selector:
    apps.zarantonello.dev/name: stalwart
    apps.zarantonello.dev/namespace: stalwart
