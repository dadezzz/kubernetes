apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public
spec:
  hostnames:
    - mta-sts.zarantonello.dev
    - mta-sts.zarantonello.net
    - mail.zarantonello.dev
  parentRefs:
    - name: srv-hetz-nbg-0-public-https
      namespace: cilium
  rules:
    - backendRefs:
        - name: stalwart-http
          port: 80
      matches:
        - path:
            type: Exact
            value: /.well-known/mta-sts.txt
        - path:
            type: Exact
            value: /robots.txt
