apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
  - files:
      - _generated/configs/config.json
    name: stalwart-config
kind: Kustomization
namespace: stalwart
resources:
  - deployments/stalwart.yaml
  - http-routes/public.yaml
  - http-routes/tailscale.yaml
  - kustomization.flux.yaml
  - namespace.yaml
  - persistent-volume-claims/data.yaml
  - persistent-volumes/stalwart-data.yaml
  - service-accounts/default.yaml
  - services/stalwart.yaml
  - tcp-routes/imaps.yaml
  - tcp-routes/smtp.yaml
  - tcp-routes/submissions.yaml
