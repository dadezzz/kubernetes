apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
spec:
  selector:
    matchLabels:
      apps.zarantonello.dev/name: victorialogs
      apps.zarantonello.dev/namespace: victorialogs
  # Persistent volume cannot be read by 2 replicas.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        monitoring.zarantonello.dev/metrics-0-id: 40f4de34-ac92-44e7-8de9-ebb4b0b533f1
        monitoring.zarantonello.dev/metrics-0-port: "9428"
      labels:
        apps.zarantonello.dev/name: victorialogs
        apps.zarantonello.dev/namespace: victorialogs
    spec:
      containers:
        - args:
            - -retentionPeriod=15d
          image: docker.io/victoriametrics/victoria-logs:v1.55.0@sha256:7bec543b83cbff641e4b568c6f28d8e9cd779e4eab3add9f8806c32af23ea1e1
          name: victorialogs
          ports:
            - containerPort: 9428
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /victoria-logs-data
              name: data
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: srv-hetz-nbg-0
      securityContext:
        runAsGroup: 57709
        runAsNonRoot: true
        runAsUser: 57709
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
