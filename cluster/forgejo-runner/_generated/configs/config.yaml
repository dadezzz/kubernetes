cache:
  dir: /data/cache

container:
  # Mount pod's /etc/hosts to keep the git.zarantonello.dev address override.
  options: -v /etc/hosts:/etc/hosts
  privileged: true
  valid_volumes:
    - /etc/hosts
    - forgejo-runner-cache-*

host:
  workdir_parent: /data/job

log:
  job_level: info
  level: info

runner:
  capacity: 1
  fetch_interval: 5s
  shutdown_timeout: 2h
