apiVersion: batch/v1
kind: CronJob
metadata:
  # Kustomize requires a name here, but it isn't used.
  name: docker-system-prune
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - command:
                - docker
                - system
                - prune
                - -fa
                - --volumes
              image: docker.io/library/docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
              name: prune
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /var/lib/docker
                  name: docker-data
                - mountPath: /tmp
                  name: docker-tmp
                - mountPath: /etc/docker
                  name: docker-config
                - mountPath: /var/run
                  name: docker-var-run
          enableServiceLinks: false
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 4880
            runAsNonRoot: true
            runAsUser: 4880
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - hostPath:
                path: /var/mnt/data-0/forgejo-runner-docker-data
              name: docker-data
            - emptyDir: {}
              name: docker-tmp
            - configMap:
                name: docker-config
              name: docker-config
            - hostPath:
                path: /var/mnt/data-0/forgejo-runner-docker-run
              name: docker-var-run
  schedule: 0 2 */5 * * # Every 5 days at 2:00.
  successfulJobsHistoryLimit: 1
