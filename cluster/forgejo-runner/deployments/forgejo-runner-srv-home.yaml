# See deployments/_patches/shared.yaml for base deployment definition.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner-srv-home
spec:
  selector:
    matchLabels:
      apps.zarantonello.dev/variant: srv-home
  template:
    metadata:
      labels:
        apps.zarantonello.dev/variant: srv-home
    spec:
      containers:
        - env:
            - name: RUNNER_UUID
              valueFrom:
                secretKeyRef:
                  key: RUNNER_UUID
                  name: srv-home-env
          name: runner
      nodeSelector:
        kubernetes.io/hostname: srv-home
      volumes:
        - name: runner-token
          secret:
            secretName: srv-home-env
