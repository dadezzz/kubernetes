apiVersion: apps/v1
kind: Deployment
metadata:
  # Kustomize requires a name here, but it isn't used.
  name: forgejo-runner
spec:
  selector:
    matchLabels:
      apps.zarantonello.dev/name: forgejo-runner
      apps.zarantonello.dev/namespace: forgejo-runner
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        apps.zarantonello.dev/name: forgejo-runner
        apps.zarantonello.dev/namespace: forgejo-runner
    spec:
      containers:
        - command:
            - forgejo-runner
            - daemon
            - --url=https://git.zarantonello.dev
            - --uuid=$(RUNNER_UUID)
            - --token-url=file:///data/token
            - --label=$(NODE_NAME):docker://busybox
            - --label=srv-generic:docker://busybox
            - --config=/etc/runner/config.yaml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUNNER_UUID
              valueFrom:
                secretKeyRef:
                  key: RUNNER_UUID
                  name: runner-env
          image: data.forgejo.org/forgejo/runner:12.13.1@sha256:e070b166b921f12a2abef432cf6108e63519d0183722c2a14ecbb8d0b0621652
          name: runner
          resources:
            limits:
              # Restart container if caches are too big.
              ephemeral-storage: 5Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # Docker daemon has to run as root.
            runAsGroup: 4880
            runAsNonRoot: true
            runAsUser: 4880
          volumeMounts:
            - mountPath: /etc/runner
              name: runner-config
            - mountPath: /data
              name: runner-data
            - mountPath: /data/token
              name: runner-token
              subPath: RUNNER_TOKEN
            - mountPath: /tmp
              name: runner-tmp
            - mountPath: /var/run
              name: docker-var-run
        - command:
            - dockerd
            - --no-new-privileges
            - --group=4880
          image: docker.io/library/docker:29.6.2-dind
          name: docker
          restartPolicy: Always
          securityContext:
            capabilities:
              drop:
                - ALL
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/docker
              name: docker-config
            - mountPath: /var/lib/docker
              name: docker-data
            - mountPath: /tmp
              name: docker-tmp
            - mountPath: /var/run
              name: docker-var-run
      enableServiceLinks: false
      hostAliases:
        # Override this so that runners connect directly to forgejo, without passing
        # through Cloudflare's proxy.
        - hostnames:
            - git.zarantonello.dev
          ip: 100.79.164.85
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Set to same value + 1 minute as the one in the runner config.
      terminationGracePeriodSeconds: 7200
      volumes:
        - configMap:
            name: runner-config
          name: runner-config
        - emptyDir: {}
          name: runner-tmp
        - emptyDir: {}
          name: runner-data
        - configMap:
            name: docker-config
          name: docker-config
        - hostPath:
            path: /var/mnt/data-0/forgejo-runner-docker-data
          name: docker-data
        - emptyDir: {}
          name: docker-tmp
        - emptyDir: {}
          name: docker-var-run
        - name: runner-token
          secret:
            secretName: runner-env
