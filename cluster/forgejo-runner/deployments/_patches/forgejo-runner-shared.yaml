apiVersion: apps/v1
kind: Deployment
metadata:
  # Kustomize requires a name here, but it isn't used.
  name: forgejo-runner
spec:
  selector:
    matchLabels:
      apps.zarantonello.dev/name: forgejo-runner
      apps.zarantonello.dev/namespace: forgejo-runner
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        apps.zarantonello.dev/name: forgejo-runner
        apps.zarantonello.dev/namespace: forgejo-runner
    spec:
      containers:
        - command:
            - forgejo-runner
            - daemon
            - --url=https://git.zarantonello.dev
            - --uuid=$(RUNNER_UUID)
            - --token-url=file:///data/token
            - --label=$(NODE_NAME):docker://busybox
            - --label=srv-generic:docker://busybox
            - --config=/etc/runner/config.yaml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          image: data.forgejo.org/forgejo/runner:13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
          name: runner
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # Docker daemon has to run as root.
            runAsGroup: 4880
            runAsNonRoot: true
            runAsUser: 4880
          volumeMounts:
            - mountPath: /etc/runner
              name: runner-config
            - mountPath: /data
              name: runner-data
            - mountPath: /data/token
              name: runner-token
              subPath: RUNNER_TOKEN
            - mountPath: /tmp
              name: runner-tmp
            - mountPath: /var/run
              name: docker-var-run
      enableServiceLinks: false
      initContainers:
        - command:
            - dockerd
            - --no-new-privileges
            - --group=4880
          image: docker.io/library/docker:29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
          name: docker
          restartPolicy: Always
          securityContext:
            capabilities:
              drop:
                - ALL
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /var/lib/docker
              name: docker-data
            - mountPath: /tmp
              name: docker-tmp
            - mountPath: /etc/docker
              name: docker-config
            - mountPath: /var/run
              name: docker-var-run
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Set to same value as the one in the runner config.
      terminationGracePeriodSeconds: 7200
      volumes:
        - configMap:
            name: runner-config
          name: runner-config
        - emptyDir: {}
          name: runner-tmp
        - hostPath:
            path: /var/mnt/data-0/forgejo-runner-data
          name: runner-data
        - hostPath:
            path: /var/mnt/data-0/forgejo-runner-docker-data
          name: docker-data
        - emptyDir: {}
          name: docker-tmp
        # Not an emptyDir since it needs to be shared with the cleanup cron job.
        - hostPath:
            path: /var/mnt/data-0/forgejo-runner-docker-run
          name: docker-var-run
        - configMap:
            name: docker-config
          name: docker-config
