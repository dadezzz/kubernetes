apiVersion: v1alpha1
kind: ResolverConfig
# We can't use blocky since DNS is required to boot the node hosting blocky.
nameservers:
  - address: 1.1.1.1
    protocol: DoH
    tlsServerName: cloudflare-dns.com
  - address: 9.9.9.9
    protocol: DoT
    tlsServerName: dns.quad9.net
searchDomains:
  # Causes issues in alpine pods when enabled.
  disableDefault: true
  # Also causes issues if DHCP sends hostnames.
  domains: []
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 0.0.0.0/0
    - ::/0
    # Exclude tailscale ips.
    - "!100.64.0.0/10"
    - "!fd7a:115c:a1e0::/48"
---
apiVersion: v1alpha1
dnsDomain: k8s.zarantonello.dev
kind: KubeNetworkConfig
# Use same node subnet size for both IPv4 and IPv6 since pods need both of them
# anyway.
nodeCIDRMaskSizeIPv4: 24
nodeCIDRMaskSizeIPv6: 120
# The default CIDRs don't assign IPv6 addresses. So we override them with
# ones that do.
podSubnets:
  - 10.96.0.0/16
  - fda9:b00c:8b29:33f9::1096:0/112
serviceSubnets:
  - 10.97.0.0/16
  - fda9:b00c:8b29:33f9::1097:0/112
---
apiVersion: v1alpha1
clusterDNS:
  - 10.97.0.10
kind: KubeletConfig
---
apiVersion: v1alpha1
enabled: true
filters:
  endpoints:
    - 0.0.0.0/0
    - ::/0
    # Don't create Wireguard tunnels encapsulated in Tailscale tunnel.
    - "!100.64.0.0/10"
    - "!fd7a:115c:a1e0::/48"
  excludeAdvertisedNetworks:
    # And don't encapsulate Tailscale traffic into Wireguard.
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48
kind: KubeSpanConfig
---
# Tailscale breaks connectivity between pods that make requests to a proxied
# service across nodes (e.g. forgejo-runner to forgejo or immich to pocketid).
# This is caused by an fwmark conflict between Cilium and Tailscale that affetcs
# Kubespan:
#
# - Cilium marks packets destined to envoy proxy with a mark conflicting with
#   Tailscales's;
# - Tailscale's default rules have a higher priority than Kubespans;
# - Tailscale sees the mark and thinks the packet is one of its own and so it
#   routes it through the external interface.
# - The packet never reaches Kubespan interface since it was 'stolen' by Tailscale.
action: unicast
apiVersion: v1alpha1
fwMark: 0x40 # 0x40
fwMask: 0x60 # 0x60
kind: RoutingRuleConfig
name: "5200" # It must sit before Tailscale's 5210
table: "180" # KubeSpan's routing table
