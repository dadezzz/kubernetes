concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check-biome:
    container:
      image: git.zarantonello.dev/infra/ci-biome:v1.0.0@sha256:e1c18746a63ede3432238028851a473c3d4be4f65b5083cb8ed1dff81cfcfc9e
    name: Check files with biome
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run biome
        run: biome ci --reporter summary >> $FORGEJO_STEP_SUMMARY

name: check-biome.yaml

"on":
  pull_request:
    branches:
      - main
